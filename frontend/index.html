<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Evaluator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-2xl w-full bg-gray-800 rounded-xl p-8 shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 mb-2">
            AI Resume Evaluator
        </h1>
        <p class="text-gray-400 mb-6">Upload your technical resume in PDF format for instant AI analysis.</p>

        <!-- Upload Form -->
        <form id="uploadForm" class="space-y-4">
            <div class="border-2 border-dashed border-gray-600 hover:border-purple-500 rounded-lg p-8 text-center cursor-pointer transition">
                <input type="file" id="resumeInput" accept=".pdf" class="hidden" required />
                <label for="resumeInput" class="cursor-pointer block text-gray-400 font-medium">
                    Click to select or drag your PDF here
                </label>
                <span id="fileName" class="text-sm text-purple-400 mt-2 block hidden"></span>
            </div>
            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition">
                Analyze Profile
            </button>
        </form>

        <!-- Loading State -->
        <div id="loading" class="hidden text-center py-6 text-purple-400 animate-pulse font-medium">
            AI is scanning your profile... Please wait.
        </div>

        <!-- Result Dashboard -->
        <div id="result" class="hidden mt-8 space-y-6 border-t border-gray-700 pt-6">
            <div>
                <h2 id="candidateName" class="text-2xl font-bold text-white"></h2>
                <p id="candidateEmail" class="text-sm text-gray-400"></p>
            </div>
            <p id="summary" class="text-gray-300 italic bg-gray-850 p-3 rounded-lg border border-gray-700"></p>
            
            <div>
                <h3 class="text-purple-400 font-semibold mb-2">Core Tech Stack</h3>
                <div id="skills" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-emerald-950/30 p-4 rounded-lg border border-emerald-500/20">
                    <h3 class="text-emerald-400 font-semibold mb-2">Key Strengths</h3>
                    <ul id="strengths" class="list-disc list-inside text-sm space-y-1 text-gray-300"></ul>
                </div>
                <div class="bg-rose-950/30 p-4 rounded-lg border border-rose-500/20">
                    <h3 class="text-rose-400 font-semibold mb-2">Areas to Improve</h3>
                    <ul id="improvements" class="list-disc list-inside text-sm space-y-1 text-gray-300"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('resumeInput');
        const fileNameSpan = document.getElementById('fileName');
        const form = document.getElementById('uploadForm');

        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                fileNameSpan.textContent = e.target.files[0].name;
                fileNameSpan.classList.remove('hidden');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('resume', file);

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('result').classList.add('hidden');

            try {
                const response = await fetch('http://localhost:5000/api/v1/analyze-resume', {
                    method: 'POST',
                    body: formData
                });
                const resData = await response.json();

                if (resData.success) {
                    const data = resData.data;
                    document.getElementById('candidateName').textContent = data.fullName;
                    document.getElementById('candidateEmail').textContent = data.email || 'No email provided';
                    document.getElementById('summary').textContent = `"${data.summary}"`;
                    
                    // Render tags
                    const skillsDiv = document.getElementById('skills');
                    skillsDiv.innerHTML = data.technicalSkills.map(s => `<span class="bg-gray-700 text-purple-300 text-xs px-3 py-1 rounded-full border border-gray-600">${s}</span>`).join('');

                    // Render lists
                    document.getElementById('strengths').innerHTML = data.strengths.map(s => `<li>${s}</li>`).join('');
                    document.getElementById('improvements').innerHTML = data.improvements.map(i => `<li>${i}</li>`).join('');

                    document.getElementById('result').classList.remove('hidden');
                } else {
                    alert('Analysis failed: ' + resData.error);
                }
            } catch (err) {
                alert('Error connecting to backend');
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
