<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Evaluator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth transitions for interactive elements */
        .fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Shimmer effect for premium skeleton loaders */
        .shimmer {
            background: linear-gradient(90deg, #1f2937 25%, #374151 50%, #1f2937 75%);
            background-size: 200% 100%;
            animation: loadingShimmer 1.5s infinite linear;
        }
        @keyframes loadingShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-center p-6 antialiased selection:bg-purple-500/30">

    <div class="max-w-2xl w-full bg-gray-900 rounded-2xl p-8 shadow-[0_0_50px_rgba(0,0,0,0.3)] border border-gray-800 backdrop-blur-md">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 mb-2 tracking-tight">
                AI Resume Evaluator
            </h1>
            <p class="text-gray-400 text-sm">Upload your technical resume in PDF format for instant AI analysis.</p>
        </div>

        <!-- Form and Upload Zone -->
        <form id="uploadForm" class="space-y-6">
            <div id="dropZone" class="group border-2 border-dashed border-gray-700 hover:border-purple-500/80 bg-gray-900/50 rounded-xl p-10 text-center cursor-pointer transition-all duration-300 transform hover:scale-[1.01]">
                <input type="file" id="resumeInput" accept=".pdf" class="hidden" required />
                
                <!-- Dynamic SVG Icon inside Upload Zone -->
                <div class="mb-4 flex justify-center">
                    <svg id="uploadIcon" class="w-10 h-10 text-gray-500 group-hover:text-purple-400 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                </div>
                
                <label for="resumeInput" class="cursor-pointer block text-gray-400 font-medium group-hover:text-gray-300 transition-colors duration-200">
                    Click to select or <span class="text-purple-400 font-semibold">drag your PDF</span> here
                </label>
                <span id="fileName" class="text-xs bg-purple-950/40 text-purple-300 px-3 py-1.5 rounded-full border border-purple-500/30 mt-3 inline-block hidden max-w-full truncate"></span>
            </div>
            
            <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold py-3.5 rounded-xl transition-all duration-300 shadow-lg shadow-purple-900/20 active:scale-[0.99]">
                Analyze Profile
            </button>
        </form>

        <!-- Premium Skeleton Loader -->
        <div id="skeletonLoader" class="hidden mt-8 space-y-6 border-t border-gray-800 pt-6 animate-pulse">
            <div class="flex items-center space-x-4">
                <div class="h-8 w-48 shimmer rounded-md"></div>
            </div>
            <div class="h-4 w-32 shimmer rounded-md"></div>
            <div class="h-20 w-full shimmer rounded-xl"></div>
            <div class="space-y-2">
                <div class="h-5 w-24 shimmer rounded-md"></div>
                <div class="flex gap-2">
                    <div class="h-6 w-16 shimmer rounded-full"></div>
                    <div class="h-6 w-20 shimmer rounded-full"></div>
                    <div class="h-6 w-24 shimmer rounded-full"></div>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="h-32 w-full shimmer rounded-xl"></div>
                <div class="h-32 w-full shimmer rounded-xl"></div>
            </div>
        </div>

        <!-- Result Dashboard -->
        <div id="result" class="hidden mt-8 space-y-6 border-t border-gray-800 pt-6 fade-in-up">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between border-b border-gray-800 pb-4">
                <div>
                    <h2 id="candidateName" class="text-2xl font-black text-white tracking-tight"></h2>
                    <p id="candidateEmail" class="text-sm text-gray-400 mt-0.5 flex items-center gap-1.5"></p>
                </div>
            </div>
            
            <div>
                <p id="summary" class="text-gray-300 leading-relaxed italic bg-gray-950/40 p-4 rounded-xl border border-gray-800/80 shadow-inner"></p>
            </div>
            
            <div>
                <h3 class="text-sm font-bold tracking-wider text-purple-400 uppercase mb-3">Core Tech Stack</h3>
                <div id="skills" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="bg-emerald-950/10 p-5 rounded-xl border border-emerald-500/10 shadow-sm">
                    <h3 class="text-emerald-400 font-bold text-sm tracking-wider uppercase mb-3 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Key Strengths
                    </h3>
                    <ul id="strengths" class="space-y-2.5 text-sm text-gray-300 list-none pl-1"></ul>
                </div>
                
                <div class="bg-rose-950/10 p-5 rounded-xl border border-rose-500/10 shadow-sm">
                    <h3 class="text-rose-400 font-bold text-sm tracking-wider uppercase mb-3 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-rose-400"></span> Areas to Improve
                    </h3>
                    <ul id="improvements" class="space-y-2.5 text-sm text-gray-300 list-none pl-1"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('resumeInput');
        const fileNameSpan = document.getElementById('fileName');
        const form = document.getElementById('uploadForm');
        const dropZone = document.getElementById('dropZone');
        const uploadIcon = document.getElementById('uploadIcon');

        // Drag & Drop Functionality
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('border-purple-500', 'bg-purple-950/10');
                uploadIcon.classList.add('scale-110', 'text-purple-400');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-purple-500', 'bg-purple-950/10');
                uploadIcon.classList.remove('scale-110', 'text-purple-400');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0 && files[0].type === "application/pdf") {
                fileInput.files = files;
                handleFileDisplay(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                handleFileDisplay(e.target.files[0]);
            }
        });

        function handleFileDisplay(file) {
            fileNameSpan.textContent = `📄 ${file.name}`;
            fileNameSpan.classList.remove('hidden');
        }

        // Dropzone click handler shortcut
        dropZone.addEventListener('click', () => fileInput.click());

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('resume', file);

            // Hide old results and trigger skeleton loader
            document.getElementById('result').classList.add('hidden');
            document.getElementById('skeletonLoader').classList.remove('hidden');

            try {
                const response = await fetch('http://127.0.0.1:4000/api/v1/analyze-resume', {
                    method: 'POST',
                    body: formData
                });
                const resData = await response.json();

                if (resData.success) {
                    const data = resData.data;
                    document.getElementById('candidateName').textContent = data.fullName;
                    document.getElementById('candidateEmail').innerHTML = `
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        ${data.email || 'No email specified'}`;
                    document.getElementById('summary').textContent = data.summary;
                    
                    // Render tech skills as modern scale-up badges
                    const skillsDiv = document.getElementById('skills');
                    skillsDiv.innerHTML = data.technicalSkills.map(s => `
                        <span class="bg-purple-950/30 text-purple-300 text-xs font-semibold px-3 py-1.5 rounded-xl border border-purple-500/20 transition-all duration-200 hover:scale-105 hover:bg-purple-950/50 cursor-default">
                            ${s}
                        </span>
                    `).join('');

                    // Render list elements with sleek dot icons
                    document.getElementById('strengths').innerHTML = data.strengths.map(s => `
                        <li class="flex items-start gap-2">
                            <span class="text-emerald-400 mt-0.5">•</span>
                            <span>${s}</span>
                        </li>
                    `).join('');
                    
                    document.getElementById('improvements').innerHTML = data.improvements.map(i => `
                        <li class="flex items-start gap-2">
                            <span class="text-rose-400 mt-0.5">•</span>
                            <span>${i}</span>
                        </li>
                    `).join('');

                    // Hide skeleton and animate the data block into view
                    document.getElementById('skeletonLoader').classList.add('hidden');
                    const resultDiv = document.getElementById('result');
                    resultDiv.classList.remove('hidden');
                    
                    // Reset and trigger CSS fade animation smoothly
                    resultDiv.style.animation = 'none';
                    resultDiv.offsetHeight; 
                    resultDiv.style.animation = null;

                } else {
                    alert('Analysis failed: ' + resData.error);
                    document.getElementById('skeletonLoader').classList.add('hidden');
                }
            } catch (err) {
                console.error(err);
                alert('Error connecting to backend: ' + err.message);
                document.getElementById('skeletonLoader').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
